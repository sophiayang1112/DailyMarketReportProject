[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DailyMarketReportProject"
version = "0.1.0"
description = "Daily cross-asset market reporting for investment research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "exchange-calendars>=4.6,<5"]

[project.scripts]
market-report = "market_report.cli:main"

[tool.setuptools.packages.find]
include = ["market_report*"]

[tool.setuptools.package-data]
market_report = ["universe.json"]
